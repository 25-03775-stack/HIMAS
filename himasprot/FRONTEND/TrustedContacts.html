
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HIMAS - Trusted Emergency Contacts</title>

    <link rel="stylesheet" href="himas_design.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1976d2;
            margin-bottom: 5px;
        }

        h2 {
            color: #263238;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .form-section {
            background: #e8f1ff;
            padding: 20px;
            border-radius: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd6e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
        }

        .add-btn {
            background: #1976d2;
            color: white;
        }

        .clear-btn {
            background: #e0e0e0;
            color: #333;
            margin-left: 8px;
        }

        .contact-section {
            margin-top: 25px;
        }

        .contact-card {
            background: white;
            border: 1px solid #dce3ec;
            border-radius: 8px;
            padding: 15px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .contact-info {
            overflow-wrap: anywhere;
        }

        .contact-info h3 {
            margin: 0 0 7px;
            color: #1976d2;
        }

        .contact-info p {
            margin: 4px 0;
            color: #555;
        }

        .delete-btn {
            background: #fce8e8;
            color: #b42332;
            flex-shrink: 0;
        }

        .empty-message {
            background: #f5f7fa;
            padding: 20px;
            text-align: center;
            color: #777;
            border-radius: 8px;
        }

        .navigation {
            margin-top: 25px;
        }

        .home-btn {
            background: #1976d2;
            color: white;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 18px;
            }

            .contact-card {
                align-items: flex-start;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <h1>HIMAS</h1>

    <h2>Trusted Emergency Contacts</h2>

    <p class="description">
        Keep your important emergency contacts available
        for quick access.
    </p>

    <!-- CONTACT FORM -->

    <div class="form-section">

        <h3>Add Emergency Contact</h3>

        <label for="contactName">Name:</label>

        <input
            type="text"
            id="contactName"
            placeholder="Enter contact name"
        >

        <label for="relationship">Relationship:</label>

        <select id="relationship">

            <option value="Mother">Mother</option>
            <option value="Father">Father</option>
            <option value="Sibling">Sibling</option>
            <option value="Husband">Husband</option>
            <option value="Wife">Wife</option>
            <option value="Friend">Friend</option>
            <option value="Relative">Relative</option>
            <option value="Other">Other</option>

        </select>

        <label for="phone">Phone Number:</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
        >

        <button class="add-btn" onclick="addContact()">
            + Add Contact
        </button>

        <button class="clear-btn" onclick="clearFields()">
            Clear Fields
        </button>

    </div>


    <!-- CONTACT LIST -->

    <div class="contact-section">

        <h3>👤 Contact List</h3>

        <div id="contactList">

            <p class="empty-message">
                No contacts added yet.
            </p>

        </div>

    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <button class="home-btn"
            onclick="window.location.href='main-page.html'">
            HOME
        </button>

    </div>

</div>


<script>

    // Retrieve saved contacts from browser storage

    let contacts = JSON.parse(
        localStorage.getItem("himas_contacts") || "[]"
    );

    // Save contacts

    function saveContacts() {

        localStorage.setItem(
            "himas_contacts",
            JSON.stringify(contacts)
        );

    }


    // Add new contact

    function addContact() {

        const contactName =
            document.getElementById("contactName").value.trim();

        const relationship =
            document.getElementById("relationship").value;

        const phone =
            document.getElementById("phone").value.trim();


        // Check required fields

        if (contactName === "" || phone === "") {

            alert("Please enter the contact name and phone number.");

            return;
        }


        // Validate phone number

        if (!/^[0-9+() -]{7,20}$/.test(phone)) {

            alert("Please check the phone number format.");

            return;
        }


        // Create contact object

        const newContact = {

            id: Date.now() + "-" + Math.random(),

            name: contactName,

            relationship: relationship,

            phone: phone

        };


        // Add contact to array

        contacts.push(newContact);


        // Save and update list

        saveContacts();

        refreshList();

        clearFields();

        alert("Emergency contact added successfully!");

    }


    // Clear input fields

    function clearFields() {

        document.getElementById("contactName").value = "";

        document.getElementById("relationship").selectedIndex = 0;

        document.getElementById("phone").value = "";

    }


    // Display all contacts

    function refreshList() {

        const contactList =
            document.getElementById("contactList");

        contactList.innerHTML = "";


        if (contacts.length === 0) {

            const message = document.createElement("p");

            message.className = "empty-message";

            message.textContent = "No contacts added yet.";

            contactList.appendChild(message);

            return;
        }


        contacts.forEach((contact, index) => {

            const card = document.createElement("div");

            card.className = "contact-card";


            const info = document.createElement("div");

            info.className = "contact-info";


            const heading = document.createElement("h3");

            heading.textContent =
                (index + 1) + ". " + contact.name;


            const relation = document.createElement("p");

            relation.textContent =
                "Relationship: " + contact.relationship;


            const number = document.createElement("p");

            number.textContent =
                "Phone: " + contact.phone;


            info.appendChild(heading);

            info.appendChild(relation);

            info.appendChild(number);


            // Delete button

            const deleteButton =
                document.createElement("button");

            deleteButton.className = "delete-btn";

            deleteButton.textContent = "Delete";

            deleteButton.onclick = function() {

                deleteContact(contact.id);

            };


            card.appendChild(info);

            card.appendChild(deleteButton);

            contactList.appendChild(card);

        });

    }


    // Delete selected contact

    function deleteContact(id) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this contact?"
        );

        if (!confirmDelete) {

            return;
        }


        contacts = contacts.filter(
            contact => contact.id !== id
        );


        saveContacts();

        refreshList();

    }


    // Automatically display saved contacts

    refreshList();

</script>

</body>
</html>
